<!DOCTYPE html>
<html lang="en">
<head>
<!-- Applies reduce-motion and the saved accent color before first paint, so a returning visitor's choices don't flash — see js/settings.js's file header. Accent preset values duplicated here (ACCENT_PRESETS lives in js/settings.js) since this must run before any script tag loads. -->
<script>try{var s=JSON.parse(localStorage.getItem('gddl_settings_v1')||'{}');if(s.reduceMotion)document.documentElement.setAttribute('data-reduce-motion','true');var A={red:['#ef4444','#dc2626','#ffffff'],orange:['#ff6e00','#e66300','#1a0d00'],yellow:['#eab308','#ca8a04','#1a1300'],green:['#22c55e','#16a34a','#ffffff'],blue:['#3b82f6','#2563eb','#ffffff'],pink:['#ec4899','#db2777','#ffffff']};var a=A[s.accentColor]||A.orange;var rs=document.documentElement.style;rs.setProperty('--primary',a[0]);rs.setProperty('--primary-dark',a[1]);rs.setProperty('--primary-on',a[2]);}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonlist | Time Machine</title>
<meta name="description" content="Reconstructed top 150 as of any past date, from AREDL's full position history.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/timemachine.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand" style="cursor:pointer;">
    <img class="brand-mark" src="assets/logo.png" width="32" height="32" alt="">
    <span class="brand-text">DEMONLIST<span>Verifier vs. showcase</span></span>
  </a>
  <div class="header-actions" id="header-actions"></div>
</header>

<main class="page" id="timemachine-root">
  <a class="back-link" href="list.html">&larr; Back to the list</a>

  <section class="tm-hero">
    <h1>Time Machine</h1>
    <p>See what the top 150 looked like on any past date.</p>

    <form class="tm-controls" id="tm-form">
      <input type="date" id="tm-date" aria-label="Pick a date">
      <button type="submit" class="btn-primary">Go</button>
      <div class="tm-quick-jumps" id="tm-quick-jumps"></div>
    </form>
    <p class="tm-range-note" id="tm-range-note"></p>
  </section>

  <div class="state-banner" id="state-banner" style="display:none;"></div>

  <div class="tm-list" id="tm-list"></div>
</main>

</p>
