name: Refresh shared YouTube cache (views)

# The cheap, frequent half: refreshes view counts only, for every video
# already identified in data/yt-cache.json (videos.list, 1 unit each,
# batched 50-at-a-time — the whole list costs on the order of 60-70
# units total). Runs every 30 minutes so the numbers shown on the site
# stay close to real-time, independent of how slowly the expensive
# showcase-discovery crawl (refresh-yt-cache.yml) works through the
# list. See scripts/refresh-yt-cache.mjs for details. Requires the same
# repo secret YOUTUBE_API_KEY as the discover workflow.
#
# Published to the `cache` branch, not `main` — see README's "Cache
# branch" section and scripts/publish-cache-branch.sh. Since data/*.json
# isn't tracked on `main` anymore, the *existing* data/yt-cache.json
# (whose verifier/showcase entries this run refreshes view counts for)
# is pulled from the cache branch before the script runs, not from the
# checkout.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with refresh-yt-cache.yml — both workflows write the same
# data/yt-cache.json file, so only one of the two runs at a time system-wide.
concurrency:
  group: yt-cache-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current data/yt-cache.json from the cache branch
        run: |
          git fetch origin cache
          mkdir -p data
          git show origin/cache:data/yt-cache.json > data/yt-cache.json 2>/dev/null || echo "No existing cache file found on the cache branch — nothing to refresh."

      - name: Run refresh script (views mode)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CACHE_MODE: views
        run: node scripts/refresh-yt-cache.mjs

      - name: Publish data/yt-cache.json to the cache branch
        run: 'bash scripts/publish-cache-branch.sh "chore: refresh shared YouTube cache (views)" data/yt-cache.json'
