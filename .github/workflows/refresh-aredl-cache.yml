name: Refresh AREDL level-list cache

# Populates data/aredl-cache.json — a snapshot of the top 150 of AREDL's
# level list so visitors read one shared, periodically-refreshed file
# instead of every single page load hitting AREDL's live API for the
# same list. See scripts/refresh-aredl-cache.mjs. Unauthenticated and
# free (no API key, no quota), so this just runs hourly, comfortably
# ahead of how often levels actually get added/reordered.
#
# Published to the `cache` branch, not `main` — see README's "Cache
# branch" section and scripts/publish-cache-branch.sh. Keeps this
# workflow's commits off the branch humans actually push to.

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aredl-cache-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run refresh script
        run: node scripts/refresh-aredl-cache.mjs

      - name: Publish data/aredl-cache.json to the cache branch
        run: 'bash scripts/publish-cache-branch.sh "chore: refresh AREDL level-list cache" data/aredl-cache.json'
