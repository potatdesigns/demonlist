name: Refresh shared YouTube cache (discover)

# The expensive half: figures out *which* video is the showcase for each
# level via the channel-video-index approach, staggered/budget-capped
# across runs. See scripts/refresh-yt-cache.mjs for the staggering/
# budget logic and js/shared-cache.js for how the site reads
# data/yt-cache.json. View counts are refreshed separately and much more
# often — see refresh-yt-views.yml. Requires a repo secret
# YOUTUBE_API_KEY (Settings -> Secrets and variables -> Actions -> New
# repository secret); without it this workflow fails fast with a clear
# error instead of silently doing nothing.
#
# Published to the `cache` branch, not `main` — see README's "Cache
# branch" section and scripts/publish-cache-branch.sh. Since data/*.json
# isn't tracked on `main` anymore, the *existing* data/yt-cache.json
# (which the script's incremental discover/channel-index logic depends
# on as its starting point) is pulled from the cache branch before the
# script runs, not from the checkout.

on:
  schedule:
    - cron: '0 8 * * *' # once a day; the script itself staggers which levels get (re-)checked
  workflow_dispatch:
    inputs:
      max_levels:
        description: 'Override: max levels to process this run'
        required: false
        default: ''
      max_units:
        description: 'Override: max YouTube quota units to spend this run'
        required: false
        default: ''
      target_level_id:
        description: 'Force-refresh a single level (its AREDL internal id, not the GD level id — see the "refresh this level" button on its detail page, which copies it for you), bypassing the staggered queue. Leave blank for the normal run.'
        required: false
        default: ''

permissions:
  contents: write

# Shared with refresh-yt-views.yml — both workflows write the same
# data/yt-cache.json file, so only one of the two runs at a time system-wide.
concurrency:
  group: yt-cache-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current data/yt-cache.json from the cache branch
        run: |
          git fetch origin cache
          mkdir -p data
          git show origin/cache:data/yt-cache.json > data/yt-cache.json 2>/dev/null || echo "No existing cache file found on the cache branch — starting fresh."

      - name: Run refresh script (discover mode)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CACHE_MODE: discover
          YT_CACHE_MAX_LEVELS: ${{ github.event.inputs.max_levels }}
          YT_CACHE_MAX_UNITS: ${{ github.event.inputs.max_units }}
          YT_CACHE_TARGET_LEVEL_ID: ${{ github.event.inputs.target_level_id }}
        run: node scripts/refresh-yt-cache.mjs

      - name: Publish data/yt-cache.json to the cache branch
        run: 'bash scripts/publish-cache-branch.sh "chore: refresh shared YouTube cache (discover)" data/yt-cache.json'
