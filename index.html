<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonlist — extreme demon rankings</title>
<meta name="description" content="An AREDL-powered Geometry Dash extreme demon list, with verifier vs. showcase view counts.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/list.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img class="brand-mark" src="assets/logo.png" width="32" height="32" alt="">
    <span class="brand-text">DEMONLIST<span>AREDL live data</span></span>
  </div>
  <div class="header-actions" id="header-actions"></div>
</header>

<main class="page">
  <section class="list-hero">
    <h1>Extreme Demon Rankings</h1>

    <div class="controls-row">
      <label class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search all levels by name…" aria-label="Search levels">
      </label>
      <form class="jump-box" id="jump-form">
        <span class="jump-hash" aria-hidden="true">#</span>
        <input type="number" id="jump-input" min="1" aria-label="Open level by rank">
        <button type="submit" class="btn-ghost" aria-label="Open">&rarr;</button>
      </form>
    </div>

    <div class="range-chips" id="list-filters" aria-label="List filters">
      <button type="button" class="range-chip" id="filter-main">Main List <span class="mono">#1–75</span></button>
      <button type="button" class="range-chip" id="filter-extended">Extended List <span class="mono">#76–150</span></button>
    </div>

    <div class="legend" aria-hidden="true">
      <span><span class="swatch" style="background:var(--cyan)"></span>Verifier video views</span>
      <span><span class="swatch" style="background:var(--magenta)"></span>Top showcase views</span>
      <span><b>Gold value</b> = higher view count of the two</span>
    </div>
  </section>

  <div class="state-banner" id="state-banner" style="display:none;"></div>

  <div class="demon-grid" id="demon-grid"></div>

  <div class="pager-row" id="pager-row" style="display:none;">
    <button class="btn-ghost" id="pager-prev" aria-label="Previous page">&larr; Prev</button>
    <form class="pager-status" id="pager-page-form">
      Page <input type="number" id="pager-page-input" min="1" aria-label="Page number"> of <span id="pager-total-pages">—</span>
    </form>
    <button class="btn-ghost" id="pager-next" aria-label="Next page">Next &rarr;</button>
  </div>
</main>

<p class="footer-note">
  &copy; 2026 &middot; Not affiliated with RobTop Games, Geometry Dash, or AREDL.
</p>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api-aredl.js"></script>
<script src="js/data-source.js"></script>
<script src="js/shared-cache.js"></script>
<script src="js/cache-admin-ui.js"></script>
<script src="js/list.js"></script>
</body>
</html>
